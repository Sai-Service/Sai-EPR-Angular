<section class="vh-100" style="background-image: linear-gradient(to right, #00C9FF, #92FE9D);">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-2-strong" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">

            <h3 class="mb-5">Login! 👋</h3>
   <form #f="ngForm" novalidate class="form-container" >
            <div data-mdb-input-init class="form-outline mb-4">
              <input type="email" id="typeEmailX-2" [(ngModel)]="username" name="username"  required ngModel   pattern="[a-zA-Z0-9]*" class="form-control form-control-lg" />
              <label class="form-label" for="typeEmailX-2">User Name</label>
            </div>

            <div data-mdb-input-init class="form-outline mb-4">
              <input type="password" id="typePasswordX-2"  [(ngModel)]="password" name="password"  required ngModel  class="form-control form-control-lg" />
              <label class="form-label" for="typePasswordX-2">Password</label>
            </div>
   </form>
            <!-- Checkbox 
            <div class="form-check d-flex justify-content-start mb-4">
              <input class="form-check-input" type="checkbox" value="" id="form1Example3" />
              <label class="form-check-label" for="form1Example3"> Remember password   </label>
            </div>-->

            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block" type="submit" (click)="login()">Login</button>

            <hr class="my-4">

           
          </div>
        </div>
		 
      </div>
    </div>
	
  </div>
  
</section>
