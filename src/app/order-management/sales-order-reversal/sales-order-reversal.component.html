<form [formGroup]="SalesOrderReversalForm" (ngSubmit)="SalesOrderReversal(SalesOrderReversalForm.value)">
    <table style="width: 100%;background-color: rgb(255, 255, 255);">
        <tr>
            <td colspan="4" class="PageHeader" style="width: 100%;">
                &nbsp;Sales&nbsp;Order&nbsp;Booking&nbsp;
            </td>
            <td colspan="2" align="right" style="background-color: #FFE4B5;text-align: right;width: 100%;">
                &nbsp;Order&nbsp;No&nbsp;&nbsp;
            </td>
            <td style="background-color: #FFE4B5;">
                <input class="form-control" formControlName="orderNumber" [(ngModel)]='orderNumber'
                    value={{orderNumber}}>
            </td>
            <td style="background-color: #FFE4B5;">
                <button type="button" class="btn-primary" [disabled]="isDisabledOrderFind"
                    (click)="OrderFind(orderNumber)"><i class="fa fa-search" aria-hidden="true"></i></button>
            </td>
        </tr>
    </table>
      <fieldset class="RFS">
                <table class="center">
                    <tr>
                        <div *ngIf="closeResetButton; then hList1; else hList2"></div>
                        <ng-template #hList2>
                            <div class="d-flex justify-content-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="sr-only" id="loading"></span>

                                </div>
                            </div>
                        </ng-template>
                        <ng-template #hList1> </ng-template>
                        <td class="LabelFontStyle" style="color: blue;width: fit-content;" colspan="4">
                            &nbsp;{{dataDisplay }}&nbsp; </td>
                    </tr>
                </table>
            </fieldset>
    <fieldset class="RFS">
        <legend id="FormsPH_LGAadhaar" class="RFSL" style="font-size: 12px;color: black;font-weight: bold;">
            Customer
            Details&nbsp;/&nbsp;
            <!-- Button trigger modal -->
            <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal"
                style="width: 8rem;color: white;">
                Additional&nbsp;Details
            </button>
        </legend>
        <div class="grid_scroll">
            <table class="center" style="width: 100%;">
                <tr>
                    <td style="width: 15%" class="LabelFontStyle1">
                        Customer&nbsp;No&nbsp;:&nbsp;
                    </td>
                    <td>
                        <input type="number" style="width: 120px;" class="form-control" disabled
                            formControlName="accountNo" [(ngModel)]='accountNo' value={{accountNo}} #myinput>
                    </td>
                    <td style="width: 15%" class="LabelFontStyle">
                        Customer&nbsp;Site&nbsp;:&nbsp;
                    </td>
                    <td>
                        <input disabled type="text" class="form-control" formControlName="name" value={{name}}
                            style="width: 160px;">
                        <input hidden disabled type="text" class="form-control" formControlName="custTaxCat"
                            [(ngModel)]='custTaxCat' value={{custTaxCat}} style="width: 160px;">
                    </td>
                    <td style="width: 10%" class="LabelFontStyle">
                        Name:&nbsp;
                    </td>
                    <td>
                        <input type="text" disabled formControlName="custName" [(ngModel)]='custName' value={{custName}}
                            class="form-control" style="width: 170px;">
                    </td>
                    <td style="width: 15%" class="LabelFontStyle">
                        Contact&nbsp;No&nbsp;:&nbsp;
                    </td>
                    <td>
                        <input type="number" disabled formControlName="mobile1" [(ngModel)]='mobile1' value={{mobile1}}
                            class="form-control" style="width: 120px;">

                    </td>
                </tr>
                <tr>
                    <td style="width: 15%" class="LabelFontStyle">
                        Biil&nbsp;To&nbsp;Address&nbsp;:&nbsp;
                    </td>
                    <td colspan="8">
                        <input disabled type="text" class="form-control" formControlName="billToAddress"
                            [(ngModel)]='billToAddress' value={{billToAddress}} style="width: 100%">
                    </td>
                </tr>
                <tr>
                    <td style="width: 15%" class="LabelFontStyle">
                        Ship&nbsp;To&nbsp;Address&nbsp;:&nbsp;
                    </td>
                    <td colspan="8">
                        <input disabled type="text" class="form-control" formControlName="shipToAddress"
                            [(ngModel)]='shipToAddress' value={{shipToAddress}} style="width: 100%;">
                    </td>

                </tr>

            </table>
        </div>
    </fieldset>
    <fieldset>
           <table class="GridFont" cellspacing="0" cellpadding="4" style="border-color:#959595;border-collapse:collapse;width: 100%; ">
           <thead>
           <tr class="GridHeader">
            <th scope="col" style="border: 1px solid black;">Invoice Type</th>
           <th scope="col" style="border: 1px solid black;">Invoice  Number</th>
            <th scope="col" style="border: 1px solid black;">Invoice Date</th>
            <th scope="col" style="border: 1px solid black;">Invoice Amount</th>
           </tr>
            </thead>
            <tbody>
            <tr *ngFor="let com of viewAllInvoiceData" class="ItemStyle" style="text-decoration:none;font-size: 12px;text-align: center;">
            <td style="border: 1px solid black;color: black;">   {{com.invType}}</td>
            <td style="border: 1px solid black;color: black;"> {{com.trxNumber}}</td>
            <td style="border: 1px solid black;color: black;">  {{com.trxDate}}</td>
            <td style="border: 1px solid black;color: black;text-align: right;padding-right: 5px;"> {{com.invoiceAmount}}</td>
             </tr>
             </tbody>
             </table>
    </fieldset>
     <fieldset class="RFS">
    <table class="center">
    <tr>
    <td>
    <button type="submit" class="btn btn-primary" id="register" (click)="refresh()">Clear</button>
    </td>
    <td>
    <button type="submit" (click)="close()" class="btn btn-primary">Close</button>
    </td>
     <td>
     <button type="submit" class="btn btn-primary" (click)="reversalSalesOrder()" [disabled]="isDisabled11" [style.display]="isVisible2 ? 'block' : 'none'">Reverse Order</button>
     </td>
    </tr>
    </table>
     </fieldset>
</form>
